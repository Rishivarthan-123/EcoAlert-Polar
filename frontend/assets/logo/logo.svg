<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="polarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55D6FF" />
      <stop offset="50%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#39E6A5" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#101F33" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#55D6FF" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbital Station Rings -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#55D6FF" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.35" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#8B7CFF" stroke-width="1" stroke-opacity="0.25" />
  
  <!-- Outer Orbit Nodes -->
  <circle cx="50" cy="6" r="3" fill="#55D6FF" filter="url(#glow)" />
  <circle cx="88" cy="50" r="2.5" fill="#39E6A5" />
  <circle cx="12" cy="50" r="2.5" fill="#8B7CFF" />
  <circle cx="50" cy="94" r="2" fill="#55D6FF" stroke-opacity="0.6" />

  <!-- Polar Mountain / Ice Peak -->
  <polygon points="50,18 24,72 76,72" fill="url(#iceGrad)" stroke="#55D6FF" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="50,18 36,72 64,72" fill="#0B1728" fill-opacity="0.5" />
  <polyline points="50,18 42,48 50,56 46,72" fill="none" stroke="#8B7CFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Snowflake / Crystal Energy Pulses -->
  <line x1="50" y1="28" x2="50" y2="68" stroke="#F4F8FC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="32" y1="52" x2="68" y2="52" stroke="#F4F8FC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="37" y1="39" x2="63" y2="65" stroke="#55D6FF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="37" y1="65" x2="63" y2="39" stroke="#55D6FF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Central Energy Core Nucleus -->
  <circle cx="50" cy="52" r="5" fill="#55D6FF" filter="url(#glow)" />
  <circle cx="50" cy="52" r="2" fill="#FFFFFF" />
</svg>
